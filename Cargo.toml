[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-data-export",
    "crates/lenso-capability-data-export-source",
    "crates/lenso-capability-data-retention",
    "crates/lenso-capability-retention-guard",
    "crates/lenso-capability-retention-participant",
    "crates/lenso-data-export-retention-postgres-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-data-export-retention-plugin"
rust-version = "1.94"

[workspace.dependencies]
lenso = { version = "0.5.0" }
lenso-capability-secrets = { version = "0.1.2" }
lenso-contract-authoring = { version = "0.1.1" }
lenso-contract-codegen = { version = "0.6.4" }
lenso-contract-runtime = { version = "0.1.3" }
lenso-kernel = { version = "0.2.0" }
lenso-plugin-authoring = { version = "0.1.1" }
lenso-postgres-kit = { version = "0.1.0" }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "time"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.52", features = ["macros", "rt"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
